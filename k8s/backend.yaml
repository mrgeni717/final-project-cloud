apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 064453092192.dkr.ecr.us-east-1.amazonaws.com/final-project-cloud-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # Caps the JVM heap explicitly — on a 1 GiB node, letting the
            # JVM guess its own heap size risks it claiming too much and
            # getting OOMKilled by Kubernetes.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx200m -Xss512k"
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              cpu: "300m"
              memory: "300Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
